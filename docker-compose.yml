# Settings are read from .env. Names start with UNDERWING_; the older AEGIS_
# names from before the rename still work.
services:
  underwing:
    build: .
    restart: unless-stopped
    ports:
      - "${UNDERWING_HOST_PORT:-${AEGIS_HOST_PORT:-8000}}:${UNDERWING_PORT:-${AEGIS_PORT:-8000}}"
    volumes:
      - ./data:/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${UNDERWING_PORT:-${AEGIS_PORT:-8000}}/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
